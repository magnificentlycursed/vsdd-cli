name: mdatron test

# Runs mdatron's own test suite + the reserved-code-allocation lint in CI.
# Per crosslink #12 PE/F3: the all_emitted_codes_are_reserved lint MUST run
# in CI, not just at developer cargo test time, so reserved-code drift can
# be caught before merge. This workflow is distinct from mdatron-verify.yml,
# which validates the vsdd-cli corpus against the installed mdatron binary.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: mdatron-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout vsdd-cli
        uses: actions/checkout@v4
        with:
          path: vsdd-cli

      - name: Checkout mdatron
        uses: actions/checkout@v4
        with:
          repository: magnificentlycursed/mdatron-cli
          path: mdatron

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mdatron/target
          key: cargo-mdatron-test-${{ runner.os }}-${{ hashFiles('mdatron/Cargo.lock') }}

      - name: cargo test --workspace
        working-directory: mdatron
        run: cargo test --workspace --locked

      - name: cargo clippy
        working-directory: mdatron
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
