name: mdatron verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: mdatron-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout vsdd-cli
        uses: actions/checkout@v4
        with:
          path: vsdd-cli

      # mdatron isn't published to crates.io yet (#48), and since the #81
      # workspace collapse vsdd consumes the mdatron BINARY (there is no longer
      # a path dependency on mdatron-core). Check out the collapsed repo at the
      # pinned release tag so CI validates against the version the repo targets
      # (0.3.x), not a floating main (vsdd-cli #824).
      - name: Checkout mdatron
        uses: actions/checkout@v4
        with:
          repository: magnificentlycursed/mdatron
          ref: v0.3.0
          path: mdatron

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mdatron/target
          key: cargo-${{ runner.os }}-${{ hashFiles('mdatron/Cargo.lock') }}

      - name: Install mdatron CLI
        working-directory: mdatron
        run: cargo install --path . --locked

      - name: Run mdatron verify
        working-directory: vsdd-cli
        run: mdatron verify --project-root .
