name: mdatron verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: mdatron-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout vsdd-cli
        uses: actions/checkout@v5
        with:
          path: vsdd-cli

      # mdatron is published on crates.io as of 0.5.0 (upstream #48), so CI
      # installs the pinned release from the registry — no sibling checkout,
      # no floating branch (vsdd-cli #816; supersedes the #824/#830 tag-pin
      # posture, and retires the sibling-checkout surface the deviation
      # registry's mdatron-sibling-pin-lag entry tracked).
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/mdatron
          key: cargo-mdatron-0.7.0-${{ runner.os }}

      - name: Install mdatron CLI (crates.io, pinned)
        run: command -v mdatron >/dev/null && mdatron --version | grep -qx 'mdatron 0\.7\.0' || cargo install mdatron --version 0.7.0 --locked --force

      # The engine-managed partition (.mdatron/*.example + manifest.yaml) is
      # committed, and only `mdatron init` checks it: verify reads the
      # manifest for lineage, never for drift. Re-run init against the pinned
      # binary and fail on any resulting diff — a stale template is rewritten
      # (diff), an edited one is refused (E0060, exit 1), a foreign collision
      # exits 2. Turns the committed templates from inert files into an
      # exercised CI-backed check (vsdd-cli#893, Platform Engineer review).
      - name: Engine-managed partition matches the pinned binary
        working-directory: vsdd-cli
        run: |
          mdatron init --project-root .
          git diff --exit-code -- .mdatron/

      # --deny-warnings escalates a warnings-only run to a failing exit
      # (mdatron #121, shipped at vsdd's own request; verified clean on the
      # current tree before arming — vsdd-cli #855/#858).
      - name: Run mdatron verify
        working-directory: vsdd-cli
        run: mdatron verify --deny-warnings --project-root .

      # The #855 tri-state + non-vacuity gate: a green verify above is not
      # evidence the required families RAN — this step consumes the versioned
      # `verify --json` envelope and asserts the schema and vocabulary
      # families are active (not skipped/errored) and that the run checked a
      # non-zero file set (checked-N versus checked-nothing).
      #
      # The consumed envelope is pinned at .mdatron/envelope-3.1.0.schema.json
      # (printed by `mdatron envelope-schema`; JSON carries no comment syntax,
      # so the pin's provenance lives here). The pin is the envelope's own
      # `envelope_schema` field (the schema `$id`, carried verbatim since
      # 3.0.0) — asserted by exact equality below, so ANY envelope version
      # change, MAJOR or MINOR, fails loud here, and that failure IS the
      # retest trigger to re-derive the pin and this consumer (vsdd-cli#877;
      # fired once, at the 3.0.0 → 3.1.0 MINOR under mdatron 0.7.0,
      # vsdd-cli#893). `families` is forward-extensible: unknown family keys
      # are tolerated; only the named ones are asserted. 3.1.0 adds the
      # `rule_dsl` family's own tri-state (the pattern-rule lane, asserted
      # active below: at least one rule's context matched at least one walked
      # file, so the lane ran — lane-level evidence, the pattern-lane leg of
      # the #855 non-vacuity option, NOT a per-pattern fire proof, which stays
      # the test suite's) and `manifest.yaml` in the `inputs` lineage. Also
      # since 3.1.0 a family opted in but claiming no file reports `inert`,
      # not `active`, so each `== "active"` below also proves the family
      # claimed something. `pipeline_status` is asserted first: a failed
      # pipeline reports every family inactive with `inputs: {}`.
      - name: Assert required families fired (tri-state + non-vacuity, #855)
        working-directory: vsdd-cli
        run: |
          mdatron verify --json --quiet --project-root . > /tmp/mdatron-envelope.json || true
          jq '{envelope: .mdatron_output_version, envelope_schema, schema: .families.schema.state, vocabulary: .families.vocabulary.state, families: (.families | to_entries | map("\(.key)=\(.value.state)")), files_checked: .summary.files_checked}' /tmp/mdatron-envelope.json
          jq -e '.pipeline_status == "ok"
                 and .mdatron_output_version == "3.1.0"
                 and .envelope_schema == "https://github.com/magnificentlycursed/mdatron/schema/mdatron-output/3.1.0"
                 and .families.schema.state == "active"
                 and .families.vocabulary.state == "active"
                 and .families.route.state == "active"
                 and .families.section.state == "active"
                 and .families.code_catalog.state == "active"
                 and .families.rule_dsl.state == "active"
                 and (.inputs | type) == "object"
                 and .summary.files_checked > 0' /tmp/mdatron-envelope.json > /dev/null
