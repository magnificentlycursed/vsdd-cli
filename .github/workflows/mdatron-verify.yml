name: mdatron verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: mdatron-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout vsdd-cli
        uses: actions/checkout@v4
        with:
          path: vsdd-cli

      # mdatron is published on crates.io as of 0.5.0 (upstream #48), so CI
      # installs the pinned release from the registry — no sibling checkout,
      # no floating branch (vsdd-cli #816; supersedes the #824/#830 tag-pin
      # posture, and retires the sibling-checkout surface the deviation
      # registry's mdatron-sibling-pin-lag entry tracked).
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/mdatron
          key: cargo-mdatron-0.5.0-${{ runner.os }}

      - name: Install mdatron CLI (crates.io, pinned)
        run: command -v mdatron >/dev/null && mdatron --version | grep -q '0\.5\.0' || cargo install mdatron --version 0.5.0 --locked

      - name: Run mdatron verify
        working-directory: vsdd-cli
        run: mdatron verify --project-root .
