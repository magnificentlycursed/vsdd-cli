name: vsdd-cli test

# Runs vsdd-cli's OWN test suite (and clippy) on every PR — the toolkit-tests
# gate (vsdd-cli #822 F3 / M1). Corpus conformance (mdatron verify) is a
# SEPARATE workflow; passing it does not mean the toolkit's behavior is green —
# that gap is exactly how the v0.3.0 flip landed a red suite as a clean commit
# (#816). Several tests (e.g. cross_references) invoke the mdatron BINARY, so
# mdatron is installed from the pinned release tag first.
#
# Before #824 this file ran MDATRON's own tests — a vestige of the pre-#81
# path dependency, when building vsdd-cli built mdatron. mdatron's tests belong
# to mdatron's CI; vsdd-cli's CI tests vsdd-cli.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: vsdd-test-${{ github.ref }}
  cancel-in-progress: true

# Read-only token; the checkout keeps no credential on disk (vsdd-cli#896).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout vsdd-cli
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: vsdd-cli
          persist-credentials: false

      # Pinned to the crates.io release (not a floating branch) so the binary
      # under test is the version the repo targets (#824 posture, moved to the
      # registry install at 0.5.0 — vsdd-cli #816; the version-skew gap, #822 M6).
      - name: Install Rust toolchain (1.88 from rust-toolchain.toml)
        # `rustup toolchain install` with no argument installs the toolchain the
        # directory's rust-toolchain.toml names (documented); `show active-toolchain`
        # prints the fired-evidence line into the log.
        working-directory: vsdd-cli
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/mdatron
            ~/.cargo/bin/mdatron.sha256
            vsdd-cli/target
          key: cargo-vsdd-test-mdatron-0.7.0-rust1.88-${{ runner.os }}-${{ hashFiles('vsdd-cli/Cargo.lock') }}

      - name: Install mdatron CLI (the toolkit tests invoke the binary)
        # Runs inside vsdd-cli so rust-toolchain.toml (1.88) governs the build,
        # not the runner image's default toolchain. On a cache hit the restored
        # binary is checked against the sha256 recorded when it was built, not
        # only its version string (vsdd-cli#896). A mismatch fails the job: the
        # cache entry is corrupt or tampered — bump the cache key to discard it.
        # This is an integrity check on the restored blob, not provenance: the
        # digest travels in the same cache entry as the binary.
        working-directory: vsdd-cli
        run: |
          if command -v mdatron >/dev/null && mdatron --version | grep -qx 'mdatron 0\.7\.0' && [ -f ~/.cargo/bin/mdatron.sha256 ]; then
            (cd ~/.cargo/bin && sha256sum -c mdatron.sha256)
          else
            cargo install mdatron --version 0.7.0 --locked --force
            (cd ~/.cargo/bin && sha256sum mdatron > mdatron.sha256 && cat mdatron.sha256)
          fi

      - name: cargo test --workspace
        working-directory: vsdd-cli
        run: cargo test --workspace --locked

      - name: cargo clippy
        working-directory: vsdd-cli
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
