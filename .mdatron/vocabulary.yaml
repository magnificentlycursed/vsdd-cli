# vsdd-cli's naming register (methodology.md § Naming + coinage governance),
# scoped by vocabulary_globs (.mdatron/config.yaml) to the ENDURING governed
# artifacts. This ARMS the letter-cluster prohibition MDATRON-E0091 —
# mechanizing the estate's "no coined labels" discipline from convention grade
# to a CI-backed check (vsdd-cli #823). A letter+number cluster in governed
# prose outside the allowed schemes fires E0091.
#
# Allowed schemes: the diagnostic-code namespaces (vsdd's own VSDD-Exxxx and the
# mdatron MDATRON-Exxxx it cites), plus standard technical terms that read as
# clusters but are not coinages — markdown/HTML heading levels, terminal OSC
# escape sequences, and versioned data-format names.
label_schemes:
  allow:
    - "^VSDD-[EWL][0-9]{4}$"     # vsdd's own diagnostic codes
    - "^MDATRON-[EWL][0-9]{4}$"  # the mdatron codes vsdd cites
    - "^H[1-6]$"                 # markdown/HTML heading levels (H1..H6)
    - "^OSC-[0-9]+$"            # terminal OSC escape sequences (OSC-8)
    - "^JSON[0-9]+$"            # versioned JSON formats (JSON5)

# Deprecated-term prohibition (MDATRON-E0093, driven by anti_patterns) — the
# mechanized form of the terminology grounding (vsdd-cli #819/#832): a governed
# prose usage of a deprecated coined/metaphor term fires E0093, so the discipline
# holds without a human linter. 'forcing seam' is armed now (0 corpus usages;
# purely a future-guard). 'chassis' and 'session-substrate' arm as the #821
# rename clears them from the corpus (arming before the rename would fire E0093
# on the corpus that still carries them). 'platform' is deliberately NOT armed as
# a bare pattern — it collides with 'cross-platform' and the platform-engineer domain.
anti_patterns:
  - pattern: "(?i)forcing[ -]seam"
    register: "deprecated coinage (vsdd-cli #819/#832) — use 'enforcement point' (the site, PEP) or 'guardrail' (the mechanism), not the opaque metaphor"
