# vsdd-cli's naming register (.design/agent-first-vsdd-toolkit.md — vocabulary + coinage governance),
# scoped by vocabulary_globs (.mdatron/config.yaml) to the ENDURING governed
# artifacts. This ARMS the letter-cluster prohibition MDATRON-E0091 —
# mechanizing the estate's "no coined labels" discipline from convention grade
# to a CI-backed check (vsdd-cli #823). A letter+number cluster in governed
# prose outside the allowed schemes fires E0091.
#
# Allowed schemes: the diagnostic-code namespaces (vsdd's own VSDD-Exxxx and the
# mdatron MDATRON-Exxxx it cites), plus standard technical terms that read as
# clusters but are not coinages — markdown/HTML heading levels, terminal OSC
# escape sequences, and versioned data-format names.
label_schemes:
  allow:
    - "^VSDD-[EWL][0-9]{4}$"     # vsdd's own diagnostic codes
    - "^MDATRON-[EWL][0-9]{4}$"  # the mdatron codes vsdd cites
    - "^H[1-6]$"                 # markdown/HTML heading levels (H1..H6)
    - "^OSC-[0-9]+$"            # terminal OSC escape sequences (OSC-8)
    - "^JSON[0-9]+$"            # versioned JSON formats (JSON5)
    - "^REQ-[0-9]+$"            # requirement identifiers (design-doc convention; mdatron#28 raise — local carve-out until upstream default)
    - "^AC-[0-9]+$"             # acceptance-criteria identifiers (design-doc convention)
    - "^Q[0-9]+$"               # open-question identifiers (design-doc convention)
    - "^CVE-[0-9]{4}(-[0-9]+)?$" # CVE vulnerability records (e.g., CVE-2021-42574, Trojan Source)

# Deprecated-term prohibition (MDATRON-E0093, driven by anti_patterns) — the
# mechanized form of the terminology grounding (vsdd-cli #819/#832): a governed
# prose usage of a deprecated coined/metaphor term fires E0093, so the discipline
# holds without a human linter. 'forcing seam' is armed now (0 corpus usages;
# purely a future-guard). 'chassis' and 'substrate' are armed as of #821 (the
# contract-wide rename cleared them from the governed corpus; arming before the
# rename would have fired E0093 on the corpus still carrying them). Per the operator
# ruling on #821, 'substrate' is armed as a bare layer-word — not only
# 'session-substrate' — so name the concrete referent. 'platform' is deliberately NOT armed as
# a bare pattern — it collides with 'cross-platform' and the platform-engineer domain.
anti_patterns:
  # Retired coinages from the contract compaction + governed-corpus rename
  # (vsdd-cli#873 / vsdd-cli#874, SO rulings 2026-09-18/24): the successors are
  # registered in templates/registry/vocabulary.yaml (0.4.0) with these as
  # deprecated_aliases; arming here makes the rename hold without a linter.
  - pattern: "(?i)phases-dispatched keystone|\\bkeystone\\b"
    register: "retired nickname (vsdd-cli#874) — say 'the phases-dispatched rule' (all phase agent-work is dispatched; only human judgment is attended) or, for the tamper-evidence sense, 'the server-synced authorship basis' (contract, Trust boundaries)"
  - pattern: "(?i)swarm[ -]invocations?"
    register: "retired coinage (vsdd-cli#874) — 'review round' (one dispatch of the Phase-3 reviewer set plus its dispositions)"
  - pattern: "(?i)format-carr(y|ied|ies)"
    register: "retired coinage (vsdd-cli#874) — 'compensating control' (internal-controls audit: a manual/format-carried discipline standing in for an unbuilt mechanized control)"
  - pattern: "(?i)exercise[ -]registry"
    register: "retired coinage (vsdd-cli#874) — 'control-effectiveness registry' (design vs operating effectiveness)"
  - pattern: "(?i)\\bharness run records?\\b|\\brun[ -]records?\\b|harness transcript|run transcript"
    register: "retired coinage (vsdd-cli#874) — 'trace' (OpenTelemetry: a run is a trace, each agent a span); 'the transcript' only when naming the runtime harness's file"
  - pattern: "(?i)consent grant"
    register: "retired harness-word (vsdd-cli#874) — 'dispatch approval' (the operator's dispatch act itself)"
  - pattern: "(?i)act-to-affordance map|affordance map\\b|crosslink-affordance closure"
    register: "retired coinage (vsdd-cli#874) — 'paved-path map' (platform engineering: the supported vehicle for an act); the data file keeps its filename until the schema-pair rename"
  - pattern: "(?i)ax[ie]s-activated|per-feature axes|declared surfaces?|surfaces-activated"
    register: "retired coinage (vsdd-cli#874) — 'project configuration' / 'configuration-activated' (configuration options are attributes of the project, not headline concepts)"
  - pattern: "(?i)invariant-first|enforcement-spine-first"
    register: "retired ordering nickname (vsdd-cli#874) — 'walking skeleton' (build the enforcement path end to end first)"
  - pattern: "(?i)forcing[ -]seam"
    register: "deprecated coinage (vsdd-cli #819/#832) — use 'enforcement point' (the site, PEP) or 'guardrail' (the mechanism), not the opaque metaphor"
  - pattern: "(?i)\\bchassis\\b"
    register: "deprecated layer-word (vsdd-cli #821) — use 'crosslink' (the tracker + orchestration tool); drop the metaphor where it sits beside 'crosslink'"
  - pattern: "(?i)\\bsubstrate\\b"
    register: "deprecated layer-word (vsdd-cli #821) — name the concrete referent: 'crosslink', 'installed-artifact integrity' (the manifest check), 'the runtime harness' (Claude Code), or 'ecosystem conventions' (cargo/git)"
