schema_version: 1
entries:
- id: manual-dispatch-fallback
  deviation: Runtime-harness Agent/Workflow dispatch rides in place of crosslink kickoff/swarm for autonomous
    execution.
  deviates_from: autonomous-execution
  stated_reason: 'Upstream kickoff-plan stall plus the missing vsdd-layer injection seam into swarm-dispatched
    agents (vsdd-cli #837/#851; upstream dollspace-gay/crosslink #55/#62).'
  retest_trigger:
    type: date
    predicate: '2026-10-31'
  trigger_context: 'Re-armed 2026-08-02 (SO, vsdd-cli #859 container adoption + audit deviation-registry-retest-material-live).
    #859 adopts container kickoff as THE headless vehicle; the tmux/plan path stalls at claude''s folder-trust
    dialog (TTY-gated, fires on ANY untrusted fresh-worktree path — NOT the .claude/settings.json pre-approval
    variant, refuted by the fork''s controlled investigation on dollspace-gay/crosslink#55; only writing
    hasTrustDialogAccepted clears it), so the tmux-path #55 fix is no longer the adopted exit and #55 is
    moot for the container path. The predicate now tracks the vsdd-layer injection seam (dollspace-gay/crosslink#62):
    swarm/container-dispatched agents cannot carry the process (primer, composed domains, supplements)
    until it lands, so the runtime-harness Agent/Workflow fallback rides until then. Operational precondition
    alongside #62: a pullable agent image — interim fork-published image now, durable via dollspace-gay/crosslink#76
    (tracked on entry container-kickoff-blocked-posture).
    Re-armed 2026-09-25 (Solution Owner ruling, in-session, ''as proposed''): the #62 predicate fired (injection seam shipped upstream, fork branch feat/62-injection-seam contained in develop 29d01852; closed 2026-09-25) but the fallback still rides because the container vehicle is not yet proven end to end: the vsdd-cli#878 pilot reached the agent (run 5) and was stopped by two upstream defects now fixed on fork PR #6 (kickoff worktree readiness; hub-cache mount). Exit condition: a pilot run on #878 that posts its result comment from inside the container. #878 is a crosslink-tracker issue the gate''s GitHub oracle cannot read, so the trigger is the entry''s own review date, 2026-10-31.'
  entry_date: 2026-08-01
  expiry: 2026-10-31
  owning_issue: vsdd-cli#845
  status: standing
  disposition_ref:
    issue: vsdd-cli#878
    comment_timestamp: 2026-09-24 23:50
- id: mdatron-sibling-pin-lag
  deviation: The CI sibling checkout is tag-pinned to mdatron v0.4.0 (mdatron-verify.yml) while the sibling's
    latest release is v0.5.0, with the pre-commit window at 0.4.x — a persisted toolchain-pin lag.
  deviates_from: null
  deviation_class: toolchain-pin
  stated_reason: 'The pin validates CI against the version the repo targets (vsdd-cli #824/#830); the
    lag is one minor at entry (pinned v0.4.0 against latest v0.5.0) and the pre-commit window''s next
    move rides the same posture. RESOLVED 2026-08-02: mdatron 0.5.0 adopted from crates.io (the first
    registry publish); the tag-pinned sibling-checkout surface retired from both CI workflows and the
    pre-commit window moved to 0.5.x — the pin lag and its observation surface are gone.'
  entry_date: 2026-08-01
  owning_issue: vsdd-cli#816
  status: resolved
  disposition_ref:
    issue: vsdd-cli#816
    comment_timestamp: 2026-08-02 00:10
- id: hand-split-slice-topology
  deviation: 'The hand-split decomposition topology — the parent contract plus the hand-split slice fleet
    (five independently-pipelined slice docs, the #840 sidecar, and a built slice doc that never had one),
    a workaround crosslink cannot model. Scope: doc-topology convergence only — flow re-entry stays open
    under manual-dispatch-fallback.'
  deviates_from: null
  deviation_class: doc-topology
  stated_reason: One pipeline per doc was the only shape crosslink could represent until the build-plan
    projection converged the program on the intended one-doc-to-swarm flow; resolved by this cycle — the
    disposition comment's cited evidence is the cycle's closing boundary commit.
  entry_date: 2026-08-01
  owning_issue: vsdd-cli#845
  status: resolved
  disposition_ref:
    issue: vsdd-cli#845
    comment_timestamp: 2026-08-01 21:59
- id: dial-less-crosslink-dispatch
  deviation: 'crosslink swarm''s launch surface hardcodes model "opus" and exposes no effort dial (mirror:
    crosslink/src/commands/swarm/lifecycle.rs:728-744) — a dispatch that cannot set both provisioning
    dials explicitly.'
  deviates_from: attended-review-round-fan-out
  stated_reason: The dial conduct bound to the dispatch act — every dispatch sets model and effort explicitly,
    never inherited — cannot be ridden on a surface that lacks the dials; blocked upstream until the effort-parameter
    issue lands.
  entry_date: 2026-08-01
  owning_issue: vsdd-cli#852
  status: resolved
  disposition_ref:
    issue: vsdd-cli#878
    comment_timestamp: 2026-09-24 23:19
- id: container-kickoff-blocked-posture
  deviation: Container kickoff (the adopted autonomous vehicle) runs on an interim fork-published agent
    image; the durable fork-publishable image build has landed (dollspace-gay/crosslink#76 merged) but a
    confirmed-usable agent image is not yet in place (dollspace-gay/crosslink#75 open).
  deviates_from: autonomous-execution
  stated_reason: 'Container kickoff is the adopted autonomous vehicle (vsdd-cli #859); its toolchain/auth
    blocker (dollspace-gay/crosslink #9, #10; recorded on vsdd-cli #597) was fixed by PR #64, and the durable
    fork-publishable image build landed with PR #76 (both merged 2026-08-02) — but dollspace-gay/crosslink#75
    ("kickoff --container has no usable agent image") stays open until a usable image is confirmed. An interim
    fork-published image (magnificentlycursed) is usable meanwhile.
    RESOLVED 2026-09-25 (Solution Owner ruling, in-session, ''as proposed''): dollspace-gay/crosslink#75 closed (container build fixed; fork PR #75 contained in upstream develop 29d01852); a usable agent image exists (ghcr.io/magnificentlycursed/crosslink-agent:nightly, pulled and run by the vsdd-cli#878 pilot from run 2); the posture flip to container-ADOPTED landed in the paved-path map (vsdd-cli#859, PR #37 merged 2026-09-25). The residual — the vehicle not yet proven end to end — is carried by manual-dispatch-fallback, not here.'
  trigger_context: 'Re-armed 2026-08-02 (SO, vsdd-cli #859 container adoption + audit deviation-registry-retest-material-live),
    then CORRECTED 2026-08-02 06:29: the prior predicate "#76 state == closed" born-fired — PR #76 merged
    at 05:39, four minutes before the routing-gate run at 05:43, blocking CI (a fast-moving PR is a fragile
    predicate). Corrected to the ISSUE the PR fixes, dollspace-gay/crosslink#75 ("kickoff --container has
    no usable agent image", still open), which closes when the image is confirmed usable rather than merely
    when the PR merged. PR #64 fixed the #9/#10 toolchain/auth substance and PR #76 landed the fork-publishable
    image build; #859 adopts container as THE autonomous vehicle. Standing until #75 closes; #9/#10 stay
    open but are not the predicate (their substance is fixed).'
  entry_date: 2026-08-01
  owning_issue: vsdd-cli#849
  status: resolved
  disposition_ref:
    issue: vsdd-cli#878
    comment_timestamp: 2026-09-24 23:19
- id: crosslink-develop-consumption
  deviation: routing-gate.yml consumes crosslink from the fork's develop branch (its lines 9-12 record
    the posture) pending the sibling's develop-to-main merge, with a re-pin to a main release tag owed
    when it lands.
  deviates_from: null
  deviation_class: toolchain-pin
  stated_reason: The fork's develop carries what the gate leg depends on ahead of the develop-to-main
    merge (operator ruling; the consumption posture and the read surface depended on are logged at magnificentlycursed/crosslink#1).
  retest_trigger:
    type: issue-state
    predicate: magnificentlycursed/crosslink#1 state == closed
  entry_date: 2026-08-01
  expiry: 2026-10-30
  owning_issue: vsdd-cli#845
  status: standing
  disposition_ref:
    issue: vsdd-cli#845
    comment_timestamp: 2026-08-01 21:59
- id: hand-authored-build-plan
  deviation: The build-plan document (.design/build-plan.md) is hand-authored — a persisted bootstrap
    fallback pending Slice 2's generated-context machinery producing it from the contract's Decomposition.
  deviates_from: null
  deviation_class: bootstrap-fallback
  stated_reason: Slice 2's generator is unbuilt; the hand-authored projection rides under REQ-2's contract-tie
    discipline (contract-over-derived precedence, Decomposition content-hash pin) until generation lands.
  retest_trigger:
    type: artifact-presence
    file: .design/build-plan.md
    section: '## Completed phases'
    pattern: Slice 2
  trigger_context: 'Preserved prose predicate (grep-decidable, zero-network): the Slice-2 phase is present
    in .design/build-plan.md''s "## Completed phases" section. The structured file/section/pattern fields
    above encode that predicate for the evaluator; Slice 2''s generator producing the build-plan from
    the contract is the named future, and its landing moves the phase into Completed phases — the retest
    signal.'
  entry_date: 2026-08-01
  expiry: 2026-11-29
  owning_issue: vsdd-cli#845
  status: standing
  disposition_ref:
    issue: vsdd-cli#845
    comment_timestamp: 2026-08-01 21:59
- id: synced-trace-oracle-unbuilt
  deviation: The conformance oracle — the trace synced to the crosslink server and made tamper-evident by corroboration — does not exist; conformance verdicts rest on local, agent-writable traces and are could-not-check grade.
  deviates_from: null
  deviation_class: capability-gap
  stated_reason: 'The sync-and-corroboration channel is an upstream crosslink capability not yet built, named as a dependency by the Verifiable conformance and efficiency member (the oracle leg and the trace-redaction leg). The upstream filing is pending (vsdd-cli#869 impact analysis, item E1); the date predicate stands in until an issue-state predicate can name the filed issue.'
  retest_trigger:
    type: date
    predicate: '2026-11-30'
  trigger_context: 'Re-arm on the upstream filing: replace the date predicate with an issue-state predicate on the filed crosslink issue; resolve when the channel lands and the verifier reads the synced copy. Review window set to 2026-11-30 (beyond the 30-day default) to align with the standing entries'' horizon and the pending filing.'
  entry_date: 2026-09-18
  expiry: 2026-11-30
  owning_issue: vsdd-cli#873
  status: standing
  disposition_ref:
    issue: vsdd-cli#869
    comment_timestamp: 2026-09-19 02:28
- id: native-spawn-interceptor-unbuilt
  deviation: No outer-harness interception of the runtime's native spawn primitive exists — neither to force the golden-path injection (a sub-agent can be spawned off the paved path) nor to cap a dispatch's agent COUNT; only per-agent token or cost caps exist (crosslink's per-agent budget cap; the fallback path's per-run token ceiling). Preventive claims for both are withheld; the spend-shape bound's runtime leg is advisory for count.
  deviates_from: null
  deviation_class: capability-gap
  stated_reason: 'An agent-count interceptor needs an outer-harness hook on the spawn primitive the checked agent cannot reach — a dependency outside vsdd (Verifiable conformance and efficiency, the spend-shape bound). Until it exists the ceiling is declared at ratification (block-grade) and breaches are detected post-hoc (advisory); no preventive claim is made for count. Recorded correction vsdd-cli#871.'
  retest_trigger:
    type: date
    predicate: '2026-11-30'
  trigger_context: 'Re-arm on a filed upstream or harness issue with an issue-state predicate; resolve when the interceptor exists on the target vehicle. Review window set to 2026-11-30 (beyond the 30-day default) to align with the standing entries'' 2026-10-31 / 2026-11-29 horizon and the pending upstream filing.'
  entry_date: 2026-09-18
  expiry: 2026-11-30
  owning_issue: vsdd-cli#873
  status: standing
  disposition_ref:
    issue: vsdd-cli#869
    comment_timestamp: 2026-09-19 02:28
