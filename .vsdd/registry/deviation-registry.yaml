    working posture in place of container kickoff.
  deviates_from: autonomous-execution
  stated_reason: 'Container kickoff is blocked at released versions for Rust fix-lane verification (dollspace-gay/crosslink
    #9, #10; recorded on vsdd-cli #597); the posture was previously prose in the map''s autonomous-execution
    condition and now carries this entry''s trigger and expiry.'
