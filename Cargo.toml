[workspace]
members = ["vsdd-core", "vsdd"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["magnificentlycursed"]
repository = "https://github.com/magnificentlycursed/vsdd-cli"

[workspace.dependencies]
# The mdatron seam is tool-to-tool (the #739 boundary; mdatron #81 collapsed
# its workspace upstream): vsdd consumes the mdatron BINARY, never a library.
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "1"
clap = { version = "4.5", features = ["derive"] }
