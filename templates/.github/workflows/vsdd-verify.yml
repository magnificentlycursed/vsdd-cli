# vsdd-verify.yml — deployed by `vsdd init` to adopting projects at .github/workflows/vsdd-verify.yml
# Runs all methodology hooks via the Rust mirror; emits SARIF for GitHub Code Scanning.
#
# Per the methodology contract .design/agent-first-vsdd-toolkit.md (Conformance checks + Gates) + the v1 GitHub-only platform requirement.
# Auth method: API key (Plan auth structurally rejected for CI per the cross-field validation).

name: vsdd verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: vsdd-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write  # SARIF upload to Code Scanning; the only write this job performs
    # Secrets are scoped to the one step that needs them, never job-wide: the
    # installs below build third-party code (every `cargo install` runs build
    # scripts), and mdatron runs with no secret in its environment. The
    # telemetry collector is retired (the static-price re-scope), so no
    # collector endpoint or token is set (vsdd-cli#896).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # vsdd is not yet published to crates.io (the registry has no crate of that
      # name; vsdd-cli#664 tracks the first publish). Installing an unclaimed
      # name by bare `cargo install vsdd` would build and run whatever anyone
      # publishes under it, so this step fails closed until the crate exists.
      # At first publish, replace the guard with the pinned install line below.
      - name: Install vsdd
        run: |
          echo "vsdd is not yet published to crates.io (vsdd-cli#664); this workflow cannot run until it is" >&2
          exit 1
          # cargo install vsdd --version <first published version> --locked
      # mdatron is the typed-markdown validator engine vsdd uses for
      # primer/domain/supplement/review-entry structural + cross-file checks.
      # mdatron is published on crates.io (0.5.0+); install the pinned release.
      - name: Install mdatron
        run: cargo install mdatron --version 0.7.0 --locked
      - name: Bootstrap toolkit artifacts
        run: vsdd init --ci-mode
      - name: Run mdatron verify
        run: mdatron verify --project-root .
      - name: Run methodology hooks
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: vsdd verify check --format sarif > vsdd-verify.sarif
      - name: Upload SARIF for code scanning
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        if: always()
        with:
          sarif_file: vsdd-verify.sarif

  bypass-marker-gate:
    runs-on: ubuntu-22.04
    if: contains(github.event.pull_request.body, 'hook-bypass')
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Check bypass-marker PR approval (label-applier ≠ PR-author)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const prAuthor = pr.data.user.login;
            const events = await github.rest.issues.listEvents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const approvalEvent = events.data.find(e =>
              e.event === 'labeled' && e.label.name === 'bypass-approved'
            );
            if (!approvalEvent) {
              core.setFailed('PR contains bypass-marker without bypass-approved label. Add label after operator-review confirms the bypass rationale.');
            } else if (approvalEvent.actor.login === prAuthor) {
              core.setFailed(`bypass-approved label was self-applied by PR author (${prAuthor}). The label-applier must differ from the PR-author — have a separate maintainer apply the label.`);
            }
