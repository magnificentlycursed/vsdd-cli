# Canonical methodology vocabulary registry.
# Deployed by `vsdd init` to adopting projects at .vsdd/registry/vocabulary.yaml.
# Operator extensions land at the end of this file; toolkit-canonical entries are managed.
#
# Per .design/agent-first-vsdd-toolkit.md (vocabulary + coinage governance),
# CI-armed by mdatron: MDATRON-E0093 (deprecated coinage/alias) + MDATRON-E0091
# (letter-cluster labels). A governed-prose use of a deprecated_aliases entry
# fires MDATRON-E0093 without a human linter.

---
schema_class: vocabulary-registry
schema_version: 1.0.0
registry_version: 0.3.0
---

# === vsdd managed ===
terms:
  - term: VSDD
    definition: Verified Spec-Driven Development; the methodology this toolkit implements
    first_introduced_in: 0.1.0
    deprecated_aliases: []
    abbreviation: VSDD
    domain_scope: [methodology]

  - term: MVR
    definition: Maximum Viable Refinement; the per-review-round closure signal when the terminal verify round reproduces none of the prior round's findings (all false positives)
    first_introduced_in: 0.1.0
    deprecated_aliases: []
    abbreviation: MVR
    domain_scope: [methodology, phase-3]

  - term: Exit Signal
    definition: Project-terminal four-dimensional convergence attestation (Phase 6)
    first_introduced_in: 0.1.0
    deprecated_aliases: ["four-dimensional convergence"]
    abbreviation: ""
    domain_scope: [methodology, phase-6]

  - term: Exacting Mentor
    definition: The adversarial reviewer stance; experienced reviewer who has seen this defect class before; holds work to the standard it can meet
    first_introduced_in: 0.1.0
    deprecated_aliases: []
    abbreviation: ""
    domain_scope: [methodology, phase-3]

  - term: IAR
    definition: Iterative Adversarial Refinement; the Phase 3 session pattern
    first_introduced_in: 0.1.0
    deprecated_aliases: []
    abbreviation: IAR
    domain_scope: [phase-3]

  - term: Red Gate
    definition: The Phase 2a committed test suite that fails by default; what Phase 2b implementation turns green
    first_introduced_in: 0.1.0
    deprecated_aliases: []
    abbreviation: ""
    domain_scope: [phase-2a, phase-2b, quality-engineer]

  - term: provenance
    definition: The provenance tag carried by every cost-relevant figure; one of recorded (read verbatim from the harness run-record usage/tool events, which the checked agent cannot author) / measured (computed deterministically over recorded values or over an actual file) / judgment (a labeled right-sizing assessment) / could-not-check (a figure the record cannot establish; reported honestly, never fabricated, never dropped, never shown as a real metric). A figure with no provenance tag is rejected. Distinct from capture-source, which names only which record field a datum was captured from.
    version: 1.0.0
    first_introduced_in: 0.1.0
    deprecated_aliases: ["cost-tally tier", "otel-metric", "otel-log-event", "otel-trace-attribute", "vsdd-custom-event", "sdk-result-message", "usage-api-reconciled", "unmeasurable"]
    abbreviation: ""
    domain_scope: [ai-engineer]

  - term: capture-source
    definition: Which record field a datum was captured from (e.g. token counts from the run-record usage events; effort from the dispatch manifest, with the transcript a sometimes-available backstop). Names the source field only, not the provenance tag (the recorded/measured/judgment/could-not-check assessment).
    first_introduced_in: 0.1.0
    deprecated_aliases: []
    abbreviation: ""
    domain_scope: [ai-engineer]

  - term: Raise to SO
    definition: Routing discipline for findings proposing spec-contract changes; routes to Solution Owner for accept/reject/amend disposition
    first_introduced_in: 0.1.0
    deprecated_aliases: []
    abbreviation: ""
    domain_scope: [methodology, solution-owner]

  - term: phase-domain composition
    definition: The matrix declaring which domains compose with each phase; enforced at four layers (matrix + per-primer + pre-phase declaration + check-phase-composition hook)
    first_introduced_in: 0.1.0
    deprecated_aliases: []
    abbreviation: ""
    domain_scope: [methodology]

  - term: paved path
    definition: The supported vehicle for a methodology act (a crosslink workflow, skill, tool, or session dispatch surface); going off it needs a stated reason. The paved-path map binds acts to vehicles (versioned data; its file still carries the retired name act-to-affordance-map.md — rename deferred to the data follow-on, vsdd-cli#874). Standard platform-engineering term.
    first_introduced_in: 0.3.0
    deprecated_aliases: []
    abbreviation: ""
    domain_scope: [methodology, ai-engineer, platform-engineer]

  - term: exception register
    definition: The plain name of the deviation-registry file (.vsdd/registry/deviation-registry.yaml) — standing departures from the paved path, each with a stated reason, one machine-decidable retest trigger, a review date, and a Solution Owner decision reference. Standard internal-controls term (risk / exception register).
    first_introduced_in: 0.3.0
    deprecated_aliases: []
    abbreviation: ""
    domain_scope: [methodology, ai-engineer]

  - term: control-effectiveness registry
    definition: The roster of authored controls paired with their expected-fire proof (a committed negative-case fixture and an occasion predicate), keyed to an independent census; proves a mechanism fired, as the install manifest proves it is installed. Standard neighbor - design effectiveness versus operating effectiveness (internal-controls audit).
    first_introduced_in: 0.3.0
    deprecated_aliases: []
    abbreviation: ""
    domain_scope: [methodology, quality-engineer, solution-architect]

  - term: regression corpus
    definition: The enumerated escape paths agents have taken (or reviewers have named) against the implemented system, each with its control, its non-forgeable trace, and an enforcement-versus-advisory mark; a probe-found escape is added as found, and a fixture is authored when the escape's occasion first arises. Standard quality-engineering term.
    first_introduced_in: 0.3.0
    deprecated_aliases: []
    abbreviation: ""
    domain_scope: [methodology, red-team, quality-engineer]

  - term: compensating control
    definition: A manual or format-carried discipline standing in for an unbuilt mechanized control during bootstrap (a round result comment citing its child handles; a commit evidence section citing the ratified decision record); held until the gate mechanizes. Standard internal-controls term.
    first_introduced_in: 0.3.0
    deprecated_aliases: []
    abbreviation: ""
    domain_scope: [methodology]

  - term: walking skeleton
    definition: The decomposition ordering that builds the enforcement path end to end first — data through detection to a live self-governance guardrail and a CI backstop — as one thin vertical slice, then adds capability slices each binding its own guardrail. Standard software-engineering term (Cockburn).
    first_introduced_in: 0.3.0
    deprecated_aliases: []
    abbreviation: ""
    domain_scope: [methodology, decomposition, solution-architect]
# === End vsdd managed ===

# Operator extensions land below this marker.
operator_extensions:
  - {}
