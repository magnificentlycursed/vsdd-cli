[package]
name = "vsdd-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Library for the VSDD methodology toolkit (VSDD-specific schemas, patterns, catalogs)"

[dependencies]
mdatron-core = { workspace = true }
serde = { workspace = true }
# Pinned to the YAML type mdatron-core's public API consumes (vsdd-cli #717;
# promoted from dev-dependency for the registry loaders, vsdd-cli #718).
serde_yaml_ng = "0.10"
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"
# Promoted from dev-dependency: the state write's unique-temp-plus-rename
# rides NamedTempFile for RAII cleanup on every failure ordering
# (vsdd-cli #721, #726; PE note on the #720 fix-pass record).
tempfile = "3"

[dev-dependencies]
