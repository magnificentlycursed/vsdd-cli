[package]
name = "vsdd-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Library for the VSDD methodology toolkit (VSDD-specific schemas, patterns, catalogs)"

[dependencies]
# The schema-pair validation engine, consumed directly since the library
# seam died (vsdd-cli #764; the #739 workspace marker) — same version and
# draft mdatron runs, keeping the two sides' verdicts aligned.
jsonschema = { workspace = true }
serde = { workspace = true }
# The registry loaders' YAML type (vsdd-cli #717, #718).
serde_yaml_ng = "0.10"
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"
# The branch grammar's registered patterns are regex strings in versioned
# data; the refs query consumes them as declared (PE note on #738).
regex = "1"
# Promoted from dev-dependency: the state write's unique-temp-plus-rename
# rides NamedTempFile for RAII cleanup on every failure ordering
# (vsdd-cli #721, #726; PE note on the #720 fix-pass record).
tempfile = "3"

[dev-dependencies]
