[package]
name = "vsdd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "VSDD methodology toolkit Rust CLI; composes against crosslink + mdatron"

[[bin]]
name = "vsdd"
path = "src/main.rs"

[dependencies]
vsdd-core = { path = "../vsdd-core" }
clap = { workspace = true }
serde_yaml = { workspace = true }
# The machine form is JSON; the repo-set config is YAML with the same
# type the core loaders use (Layer 3, vsdd-cli #772, #773).
serde_json = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = "0.10"

[dev-dependencies]
# The red-gate suite parses snapshot fixtures with the same YAML type
# the core loaders use (vsdd-cli #717) and builds broken-state trees.
serde_yaml_ng = "0.10"
tempfile = "3"
